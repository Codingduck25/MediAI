<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">
    <label for="sidebar-toggle" class="hamburger-label">☰</label>

    <div class="app">
        <aside class="sidebar">
            <nav class="nav-links">
                <input type="radio" name="convo" id="convo1" class="convo-radio">
                <label for="convo1" class="nav-link-label">First Convo</label>

                <input type="radio" name="convo" id="convo2" class="convo-radio">
                <label for="convo2" class="nav-link-label">Second Convo</label>

                <input type="radio" name="convo" id="convo3" class="convo-radio">
                <label for="convo3" class="nav-link-label">Third Convo</label>
            </nav>
            <a href="thankyou.html" class="exit-btn">Exit</a>
        </aside>
        <main class="content">
            <div class="topbar">
                <div class="logo">LOGO</div>
            </div>

            <div class="mic-area">
                <button class="mic-btn">Speak</button>
                <button class="end-btn">End</button>
            </div>
        </main>
    </div>
</body>
</html>
